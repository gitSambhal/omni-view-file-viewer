<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg-grad)" stroke="#334155" stroke-width="8" />
  
  <!-- Back File Layer -->
  <rect x="120" y="100" width="240" height="300" rx="20" fill="#334155" opacity="0.6" />
  
  <!-- Main File Card -->
  <path d="M150 120 h150 l70 70 v200 a20 20 0 0 1 -20 20 h-200 a20 20 0 0 1 -20 -20 v-250 a20 20 0 0 1 20 -20 z" fill="url(#primary-grad)" />
  <path d="M300 120 v50 a20 20 0 0 0 20 20 h50 z" fill="#60a5fa" />
  
  <!-- Eye Lens Overlay (OmniView Logo) -->
  <g filter="url(#glow)">
    <!-- Eye Outer Outline -->
    <path d="M 180 280 C 210 230, 300 230, 330 280 C 300 330, 210 330, 180 280 Z" fill="#0f172a" stroke="url(#accent-grad)" stroke-width="14" />
    <!-- Eye Iris -->
    <circle cx="255" cy="280" r="32" fill="url(#accent-grad)" />
    <!-- Pupil Reflection -->
    <circle cx="245" cy="272" r="10" fill="#ffffff" opacity="0.9" />
  </g>

  <!-- Live Sync Arrows Accent -->
  <path d="M 370 340 A 35 35 0 0 1 320 380" fill="none" stroke="#10b981" stroke-width="8" stroke-linecap="round" />
  <polygon points="320,370 320,390 305,380" fill="#10b981" />
</svg>
